name: Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Build frontend
        working-directory: web
        run: |
          pnpm install
          pnpm build

      - name: Build Windows exe
        env:
          CGO_ENABLED: '0'
          GOOS: windows
          GOARCH: amd64
        run: go build -ldflags "-s -w -X main.version=GM-1.0" -o Pst-GM.exe .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pst-GM-windows
          path: Pst-GM.exe
          retention-days: 30
